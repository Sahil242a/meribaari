services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  app:
    build: .
    ports: ['4000:4000']
    environment:
      MONGO_URL: mongodb://mongo:27017/meribaari
      JWT_SECRET: please-change-me-in-real-deploys
      CLIENT_ORIGIN: http://localhost:4000
      PUBLIC_URL: http://localhost:4000
      COOKIE_SECURE: 'false' # set to "true" when served over HTTPS
    depends_on: [mongo]
volumes:
  mongo-data:
