# One-click deploy on Render (render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: meribaari
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci --include=dev && npm --prefix client run build && npm --prefix server ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false # paste your Atlas connection string in the Render dashboard
      - key: PUBLIC_URL
        sync: false # e.g. https://meribaari.onrender.com
      - key: CLIENT_ORIGIN
        sync: false # same as PUBLIC_URL
      - key: NOTIFY_PROVIDER
        value: console
